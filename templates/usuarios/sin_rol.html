{% extends "base.html" %}

{% block title %}Sin rol asignado{% endblock %}

{% block content %}

<div class="page-center">
    <div class="card auth-card">

        <div class="warning-icon">
            !
        </div>

        <h1 class="page-title text-center">
            Acceso restringido
        </h1>

        <p class="page-description text-center">
            Tu usuario no tiene un rol asignado todavía.
        </p>

        <p class="page-description text-center">
            Contactá a un administrador del sistema para continuar.
        </p>

        <form method="post" action="{% url 'logout' %}" class="mt-6 text-center">
            {% csrf_token %}

            <button class="btn-secondary" type="submit">
                Cerrar sesión
            </button>
        </form>

    </div>
</div>

{% endblock %}
